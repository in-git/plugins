<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>图片探查器</title>
  <link rel="stylesheet" href="tailwind.css">
</head>
<body class="m-0 h-screen w-screen overflow-hidden bg-white font-sans text-ink antialiased">
  <div class="flex h-full flex-col rounded-modal bg-white">

    <!-- 标题栏 -->
    <header class="flex shrink-0 items-center justify-between px-7 pb-5 pt-7">
      <h1 class="text-[16px] font-semibold tracking-[-0.01em] text-ink">图片探查器</h1>
      <span id="count" class="rounded-full bg-canvas px-3 py-1 text-[11px] tracking-wide text-subtle">0 张</span>
    </header>

    <!-- 工具栏 -->
    <div class="flex shrink-0 flex-wrap items-center gap-2 px-7 pb-6">
      <button id="refresh" title="重新扫描当前页面" class="inline-flex h-8 items-center gap-1.5 rounded-control border border-black/[0.07] bg-white px-3 text-[12px] text-ink transition-colors hover:bg-canvas disabled:cursor-not-allowed disabled:opacity-40">
        <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16.5 10a6.5 6.5 0 1 1-1.9-4.6"/><path d="M16.5 3.5v4h-4"/>
        </svg>
        重新扫描
      </button>
      <button id="selectAll" class="inline-flex h-8 items-center rounded-control border border-black/[0.07] bg-white px-3 text-[12px] text-ink transition-colors hover:bg-canvas disabled:cursor-not-allowed disabled:opacity-40">全选</button>
      <button id="downloadSelected" class="inline-flex h-8 items-center rounded-control border border-black/[0.07] bg-white px-3 text-[12px] text-ink transition-colors hover:bg-canvas disabled:cursor-not-allowed disabled:opacity-40">下载选中</button>
      <button id="downloadAll" class="inline-flex h-8 items-center rounded-control bg-accent px-3.5 text-[12px] text-white transition-colors hover:bg-[#0071eb] disabled:cursor-not-allowed disabled:opacity-40">打包下载</button>
      <span class="flex-1"></span>
      <label class="inline-flex cursor-pointer select-none items-center gap-1.5 text-[11px] text-subtle">
        <input id="hideSmall" type="checkbox" class="m-0 h-3.5 w-3.5 cursor-pointer accent-accent">
        过滤小图
      </label>
      <button id="toggleView" title="切换网格 / 列表" class="inline-flex h-8 items-center rounded-control border border-black/[0.07] bg-white px-3 text-[12px] text-ink transition-colors hover:bg-canvas disabled:cursor-not-allowed disabled:opacity-40">列表</button>
    </div>

    <!-- 内容区 -->
    <main class="min-h-0 flex-1 overflow-y-auto px-7 pb-7">
      <div id="grid" class="grid grid-cols-3 gap-3.5"></div>
    </main>

    <!-- 状态栏 -->
    <footer class="flex shrink-0 items-center justify-between gap-4 border-t border-black/[0.05] px-7 py-3.5 text-[11px] text-subtle">
      <span id="status" class="truncate">准备就绪</span>
      <span id="pageTitle" class="max-w-[45%] shrink-0 truncate text-[#b8b8bd]"></span>
    </footer>

  </div>

  <script src="zip.js"></script>
  <script src="popup.js"></script>
</body>
</html>
