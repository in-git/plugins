<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>视频下载工具-吴文龙</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0b1120;
    color: #e5e7eb;
  }

  .wrap { max-width: 980px; margin: 0 auto; padding: 48px 24px 120px; }
  h1 { font-size: 28px; margin: 0 0 12px; }
  .lead { color: #94a3b8; line-height: 1.7; }
  kbd {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid #475569;
    border-bottom-width: 2px;
    border-radius: 4px;
    background: #1e293b;
    color: #e2e8f0;
    font: 12px/1.5 ui-monospace, Consolas, monospace;
  }

  .card {
    margin-top: 24px;
    padding: 20px;
    border: 1px solid #1e293b;
    border-radius: 14px;
    background: #111827;
  }
  .card h2 { margin: 0 0 14px; font-size: 18px; }
  .grid { display: flex; gap: 16px; flex-wrap: wrap; }
  video { background: #000; border-radius: 8px; }
  .nested { padding: 16px; border: 1px dashed #334155; border-radius: 10px; }
  #shadow-host { margin-top: 16px; display: block; }

  #vi-badge {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 2147483647;
    padding: 8px 12px;
    border-radius: 999px;
    background: #1e293b;
    border: 1px solid #334155;
    font-size: 12px;
    color: #cbd5e1;
  }
  #vi-badge.on { background: #0c4a6e; border-color: #38bdf8; color: #e0f2fe; }

  #vi-overlays { position: fixed; inset: 0; z-index: 2147483646; pointer-events: none; }
  .box { position: absolute; }
  .box.element { border: 2px solid #38bdf8; background: rgba(56, 189, 248, .08); }
  .box.video { border: 2px dashed #f87171; background: rgba(248, 113, 113, .10); }
  .box-label {
    position: absolute;
    left: 0;
    top: -20px;
    max-width: 320px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 2px 6px;
    border-radius: 4px;
    font: 11px/1.4 ui-monospace, Consolas, monospace;
    color: #0b1120;
    background: #38bdf8;
  }
  .box.video .box-label { top: auto; bottom: -20px; background: #f87171; }

  #vi-tip {
    position: fixed;
    z-index: 2147483647;
    pointer-events: none;
    display: none;
    padding: 7px 10px;
    border-radius: 8px;
    background: #020617;
    border: 1px solid #334155;
    color: #e2e8f0;
    font: 12px/1.5 ui-monospace, Consolas, monospace;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
    white-space: nowrap;
  }

  #vi-panel {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 2147483647;
    width: min(420px, calc(100vw - 32px));
    max-height: 55vh;
    overflow: auto;
    padding: 16px;
    border-radius: 12px;
    background: rgba(15, 23, 42, .97);
    border: 1px solid #334155;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .panel-head strong { font-size: 14px; }
  .panel-head button {
    cursor: pointer;
    border: 1px solid #475569;
    background: #1e293b;
    color: #e2e8f0;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
  }
  .summary-target { font: 12px/1.6 ui-monospace, Consolas, monospace; color: #93c5fd; word-break: break-all; }
  .count { margin: 8px 0 12px; font-size: 14px; }
  .count b { font-size: 26px; color: #fca5a5; }
  .empty { color: #64748b; font-size: 12px; }
  .vitem {
    padding: 10px;
    margin-top: 8px;
    border: 1px solid #1e293b;
    border-radius: 8px;
    background: #0f172a;
    font-size: 12px;
    line-height: 1.6;
  }
  .vtitle { color: #fecaca; font-weight: 600; margin-bottom: 2px; }
  .vitem div { word-break: break-all; }
</style>
</head>
<body>
<div id="vi-badge">Alt+S 探查（关）</div>
<div id="vi-overlays"></div>
<div id="vi-tip"></div>

<div class="wrap">
  <h1>视频下载工具-吴文龙</h1>
  <p class="lead">
    按 <kbd>Alt</kbd> + <kbd>S</kbd> 开启探查模式。移动鼠标会高亮当前元素，并在元素内部用红色虚线框标出视频；
    提示框和右下角面板会显示视频个数。单击锁定结果，按 <kbd>Esc</kbd> 退出。
  </p>

  <section class="card">
    <h2>区域 A：普通嵌套（2 个视频）</h2>
    <div class="grid">
      <video controls width="280" height="160"></video>
      <div style="padding:12px;border:1px solid #334155;border-radius:8px;">
        <video controls width="280" height="160"></video>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>区域 B：Shadow DOM + 更深层嵌套（2 个视频）</h2>
    <div class="nested">
      <div style="padding:12px;">
        <video controls width="280" height="160"></video>
      </div>
    </div>
    <div id="shadow-host"></div>
  </section>

  <section class="card">
    <h2>区域 C：没有视频</h2>
    <p class="lead">把鼠标移到这块区域，视频数应该显示为 0。</p>
  </section>
</div>

<aside id="vi-panel" hidden>
  <div class="panel-head">
    <strong>探查结果</strong>
    <button id="vi-close" type="button">关闭</button>
  </div>
  <div class="summary-target" id="vi-target"></div>
  <div class="count">视频个数：<b id="vi-count">0</b></div>
  <div id="vi-list"></div>
</aside>

<script>
(() => {
  'use strict';

  const hotkey = 's';
  const maxDepth = 12;
  const cache = new WeakMap();

  let active = false;
  let locked = false;
  let rafId = 0;
  let lastMouse = { x: 0, y: 0 };
  let current = null;

  const badge = document.getElementById('vi-badge');
  const overlays = document.getElementById('vi-overlays');
  const tip = document.getElementById('vi-tip');
  const panel = document.getElementById('vi-panel');
  const targetEl = document.getElementById('vi-target');
  const countEl = document.getElementById('vi-count');
  const listEl = document.getElementById('vi-list');
  const closeBtn = document.getElementById('vi-close');

  closeBtn.addEventListener('click', () => setActive(false));

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && active) {
      event.preventDefault();
      setActive(false);
      return;
    }
    if (!event.altKey || event.ctrlKey || event.metaKey) return;
    if ((event.key || '').toLowerCase() !== hotkey) return;
    if (isTyping(event.target)) return;
    event.preventDefault();
    setActive(!active);
  }, true);

  document.addEventListener('mousemove', (event) => {
    if (!active) return;
    lastMouse = { x: event.clientX, y: event.clientY };
    if (locked) return;
    schedule();
  }, true);

  document.addEventListener('mousedown', (event) => {
    if (!active || event.button !== 0) return;
    if (isInsidePanel(event.target)) return;
    event.preventDefault();
    event.stopPropagation();
    lastMouse = { x: event.clientX, y: event.clientY };
    computeNow();
    locked = !locked;
    if (locked) {
      renderPanel(current);
      render();
    } else {
      panel.hidden = true;
      render();
    }
  }, true);

  document.addEventListener('click', (event) => {
    if (!active || isInsidePanel(event.target)) return;
    event.preventDefault();
    event.stopPropagation();
  }, true);

  function setActive(next) {
    active = next;
    locked = false;
    current = null;
    panel.hidden = true;
    if (!active) {
      badge.textContent = 'Alt+S 探查（关）';
      badge.classList.remove('on');
      overlays.replaceChildren();
      tip.style.display = 'none';
      return;
    }
    badge.textContent = '探查中：移动查看 · 单击锁定 · Esc 退出';
    badge.classList.add('on');
    computeNow();
  }

  function schedule() {
    if (rafId) return;
    rafId = requestAnimationFrame(() => {
      rafId = 0;
      computeNow();
    });
  }

  function computeNow() {
    if (!active) return;
    const hit = hitTest(document, lastMouse.x, lastMouse.y);
    if (!hit) {
      current = null;
      render();
      return;
    }
    let videos = cache.get(hit.el);
    if (!videos) {
      videos = collectVideos(hit.el, 0, 0, 0);
      cache.set(hit.el, videos);
    }
    current = { ...hit, videos, label: describe(hit.el) };
    render();
    if (locked) renderPanel(current);
  }

  function hitTest(doc, x, y, offsetX = 0, offsetY = 0, depth = 0) {
    if (depth > maxDepth || !doc || !isReadable(doc)) return null;
    let el;
    try { el = doc.elementFromPoint(x, y); } catch (_) { return null; }
    if (!el) return null;

    if (el.tagName === 'IFRAME') {
      let inner = null;
      try { inner = el.contentDocument; } catch (_) {}
      if (inner && isReadable(inner)) {
        const rect = el.getBoundingClientRect();
        const nx = x - rect.left;
        const ny = y - rect.top;
        if (nx >= 0 && ny >= 0 && nx <= rect.width && ny <= rect.height) {
          const found = hitTest(inner, nx, ny, offsetX + rect.left, offsetY + rect.top, depth + 1);
          if (found) return found;
        }
      }
    }

    if (el.shadowRoot) {
      let shadowEl = null;
      try { shadowEl = el.shadowRoot.elementFromPoint(x, y); } catch (_) {}
      if (shadowEl && shadowEl !== el) {
        return makeHit(shadowEl, doc, offsetX, offsetY);
      }
    }

    return makeHit(el, doc, offsetX, offsetY);
  }

  function makeHit(el, doc, offsetX, offsetY) {
    const rect = el.getBoundingClientRect();
    return {
      el,
      doc,
      rect: {
        left: rect.left + offsetX,
        top: rect.top + offsetY,
        width: rect.width,
        height: rect.height,
        right: rect.right + offsetX,
        bottom: rect.bottom + offsetY
      }
    };
  }

  function collectVideos(node, offsetX, offsetY, depth, out = [], seen = new Set()) {
    if (!node || depth > maxDepth || seen.has(node)) return out;
    seen.add(node);

    if (node.nodeType === 1) {
      if (node.tagName === 'VIDEO') {
        out.push({ el: node, ox: offsetX, oy: offsetY });
        return out;
      }
      if (node.tagName === 'IFRAME') {
        let doc = null;
        try { doc = node.contentDocument; } catch (_) {}
        if (doc && doc.documentElement) {
          const rect = node.getBoundingClientRect();
          collectVideos(doc.documentElement, offsetX + rect.left, offsetY + rect.top, depth + 1, out, seen);
        }
        return out;
      }
      if (node.shadowRoot) {
        collectVideos(node.shadowRoot, offsetX, offsetY, depth + 1, out, seen);
      }
    }

    let children = [];
    try { children = node.querySelectorAll ? Array.from(node.querySelectorAll('*')) : []; } catch (_) {}
    for (const child of children) {
      if (seen.has(child)) continue;
      if (child.tagName === 'VIDEO') {
        out.push({ el: child, ox: offsetX, oy: offsetY });
        continue;
      }
      if (child.shadowRoot) {
        collectVideos(child.shadowRoot, offsetX, offsetY, depth + 1, out, seen);
      }
      if (child.tagName === 'IFRAME') {
        let doc = null;
        try { doc = child.contentDocument; } catch (_) {}
        if (doc && doc.documentElement) {
          const rect = child.getBoundingClientRect();
          collectVideos(doc.documentElement, offsetX + rect.left, offsetY + rect.top, depth + 1, out, seen);
        }
      }
    }
    return out;
  }

  function render() {
    overlays.replaceChildren();
    if (!current) {
      tip.style.display = 'none';
      return;
    }

    addBox(current.rect, 'element', current.label + (locked ? '（已锁定）' : ''));

    current.videos.slice(0, 80).forEach((item, index) => {
      const rect = item.el.getBoundingClientRect();
      addBox({
        left: rect.left + item.ox,
        top: rect.top + item.oy,
        width: rect.width,
        height: rect.height,
        right: rect.right + item.ox,
        bottom: rect.bottom + item.oy
      }, 'video', 'video ' + (index + 1));
    });

    tip.textContent = current.label + '  |  视频 ' + current.videos.length + ' 个' + (locked ? '  |  已锁定' : '');
    tip.style.display = 'block';
    const tw = tip.offsetWidth;
    const th = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(lastMouse.x + 14, window.innerWidth - tw - 8)) + 'px';
    tip.style.top = Math.max(8, Math.min(lastMouse.y + 14, window.innerHeight - th - 8)) + 'px';
  }

  function addBox(rect, type, label) {
    if (!rect || rect.width <= 0 || rect.height <= 0) return;
    const box = document.createElement('div');
    box.className = 'box ' + type;
    box.style.left = rect.left + 'px';
    box.style.top = rect.top + 'px';
    box.style.width = rect.width + 'px';
    box.style.height = rect.height + 'px';
    const tag = document.createElement('span');
    tag.className = 'box-label';
    tag.textContent = label;
    box.appendChild(tag);
    overlays.appendChild(box);
  }

  function renderPanel(data) {
    if (!data) {
      panel.hidden = true;
      return;
    }
    panel.hidden = false;
    targetEl.textContent = data.label;
    countEl.textContent = String(data.videos.length);

    listEl.replaceChildren();
    if (!data.videos.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '该元素下面没有 video 元素。';
      listEl.appendChild(empty);
      return;
    }

    data.videos.forEach((item, index) => {
      const video = item.el;
      const box = document.createElement('div');
      box.className = 'vitem';

      const title = document.createElement('div');
      title.className = 'vtitle';
      title.textContent = '#' + (index + 1) + ' ' + describe(video);
      box.appendChild(title);

      const src = document.createElement('div');
      src.textContent = 'src: ' + videoSrc(video);
      box.appendChild(src);

      const state = document.createElement('div');
      state.textContent = '状态: ' + (video.paused ? '暂停' : '播放中') +
        ' · 时长: ' + formatDuration(video.duration) +
        ' · 尺寸: ' + (video.videoWidth && video.videoHeight ? video.videoWidth + '×' + video.videoHeight : '-');
      box.appendChild(state);

      listEl.appendChild(box);
    });
  }

  function videoSrc(video) {
    if (video.currentSrc) return video.currentSrc;
    if (video.src) return video.src;
    const sources = Array.from(video.querySelectorAll('source'))
      .map((source) => source.src || source.getAttribute('src'))
      .filter(Boolean);
    return sources.length ? sources.join(', ') : '（无 src）';
  }

  function formatDuration(value) {
    if (!Number.isFinite(value) || value <= 0) return '-';
    const m = Math.floor(value / 60);
    const s = Math.floor(value % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  function describe(el) {
    if (!el) return '';
    const tag = (el.tagName || el.nodeName || '').toLowerCase();
    const id = el.id ? '#' + el.id : '';
    let cls = '';
    if (typeof el.className === 'string' && el.className.trim()) {
      cls = '.' + el.className.trim().split(/\s+/).join('.');
    }
    return tag + id + cls;
  }

  function isReadable(doc) {
    try { return Boolean(doc && doc.body); } catch (_) { return false; }
  }

  function isInsidePanel(node) {
    try { return Boolean(node && node.closest && node.closest('#vi-panel')); } catch (_) { return false; }
  }

  function isTyping(node) {
    if (!node) return false;
    const tag = (node.tagName || '').toLowerCase();
    return tag === 'input' || tag === 'textarea' || tag === 'select' || node.isContentEditable === true;
  }

  const host = document.getElementById('shadow-host');
  if (host && !host.shadowRoot) {
    const shadow = host.attachShadow({ mode: 'open' });
    shadow.innerHTML = '<style>video{display:block;width:280px;height:160px;background:#000;border-radius:8px}</style><video controls></video>';
  }
})();
</script>
</body>
</html>
